name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]  # Triggers the workflow every time you push to main

jobs:
  # 1. Test and Validate Job
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        run: python manage.py check

      - name: Run Tests
        run: python manage.py test

  # 2. Deployment Job
  deploy:
    runs-on: ubuntu-latest
    needs: test  # Only deploy if tests pass successfully
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to project directory
            cd /var/www/my-django-app
            
            # Pull latest changes from git
            git pull origin main
            
            # Activate virtual environment
            source venv/bin/activate
            
            # Install updated dependencies
            pip install -r requirements.txt
            
            # Run database migrations
            python manage.py migrate
            
            # Collect static files
            python manage.py collectstatic --noinput
            
            # Restart WSGI/ASGI application server (e.g., Gunicorn or uWSGI)
            sudo systemctl restart gunicorn
